# docker-compose.yml — App service + Langfuse/Qdrant/Redis
#
#   docker build -t lesson-13-homework:multi-stage .   # build the local image first
#   docker compose up -d
#   docker compose ps
#   curl -X POST localhost:8000/ask -H 'content-type: application/json' -d '{"question":"What is Docker?"}'
#
# Service URLs (from host):
#   app       -> http://localhost:8000
#   langfuse  -> http://localhost:3000
#   qdrant    -> http://localhost:6333/dashboard
#   redis     -> localhost:6379

services:
  app:
    image: lesson-13-homework:multi-stage
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Wiring to the other services (config.py ignores unknown keys for now)
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      LANGFUSE_HOST: http://langfuse:3000
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      langfuse:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health',timeout=3).json().get('status')=='ok' else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks: [ragnet]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # HTTP / dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks: [ragnet]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [ragnet]

  # --- Langfuse (v2: single app container + its own Postgres) ---
  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-nextauth-secret
      SALT: change-me-salt
      TELEMETRY_ENABLED: "false"
    restart: unless-stopped
    networks: [ragnet]

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [ragnet]

volumes:
  qdrant_data:
  redis_data:
  langfuse_db_data:

networks:
  ragnet:
    driver: bridge
